name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared Swift CI on the self-hosted macOS runner (Swift 6.4 toolchain):
  # build --build-tests, swift test, and the DocC build gate with
  # --warnings-as-errors.
  ci:
    uses: swissarmyhammer/workflows/.github/workflows/swift-ci.yaml@main
    with:
      docc-target: FoundationModelsACP
      # IntegrationTests/ is a nested package the root manifest never names,
      # so a bare `swift test` here only ever runs the unit suite. The shared
      # workflow builds this package on every run and runs
      # `swift test --package-path IntegrationTests` after the unit job.
      integration-package-path: IntegrationTests

  # Repo-specific: regenerate the ACP types from the vendored schema and fail if
  # the checked-in output drifts. Needs the Swift 6.4 toolchain to build the
  # acp-generate plugin, so it runs on the same self-hosted runner.
  codegen:
    name: Codegen diff gate
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      # The content-hash stamp is checked in, so a plain run short-circuits and
      # rewrites nothing — leaving a hand-edited generated file, or output stale
      # against a generator change, undetected. Dropping the stamp forces a full
      # regeneration, which is what the diff below is meant to compare against.
      - name: Drop the content-hash stamp
        run: rm -f Sources/FoundationModelsACP/Generated/.schema-hash
      - name: Regenerate codegen
        run: swift package --allow-writing-to-package-directory generate-acp
      - name: Fail on drift
        run: git diff --exit-code
